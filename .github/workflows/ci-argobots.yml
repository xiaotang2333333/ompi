name: Argobots Overlay CI

on:
  push:
    branches: [ci-argobots]
    paths:
      - overlay-ports/argobots/**
      - .github/workflows/ci-argobots.yml
      - .github/tests/argobots-smoke.c
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argobots-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 3aea538b2bb21a586502c67b00eb474fdd2e3098
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_BINARY_SOURCES: clear

jobs:
  build:
    name: ${{ matrix.triplet }} / Debug and Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        triplet: [x64-linux, x64-linux-dynamic]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool libtool-bin m4 zip unzip tar git

      - name: Bootstrap pinned vcpkg
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build only Argobots
        run: |
          ./vcpkg/vcpkg install "argobots:${{ matrix.triplet }}" \
            --classic --overlay-ports="$GITHUB_WORKSPACE/overlay-ports" \
            --x-install-root="$GITHUB_WORKSPACE/installed"

      - name: Verify installed artifacts and consumers
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/installed/$TRIPLET"
          test -f "$root/include/abt.h"
          test -s "$root/share/argobots/copyright"
          for config in release debug; do
            libdir="$root/lib"
            if [[ "$config" == debug ]]; then
              libdir="$root/debug/lib"
            fi
            export PKG_CONFIG_LIBDIR="$libdir/pkgconfig"
            unset PKG_CONFIG_PATH
            pkg-config --modversion argobots
            if [[ "$TRIPLET" == x64-linux ]]; then
              test -f "$libdir/libabt.a"
            else
              test -f "$libdir/libabt.so"
            fi
            for integration in pkgconfig direct; do
              binary="$RUNNER_TEMP/argobots-$config-$integration"
              if [[ "$integration" == pkgconfig ]]; then
                cc -std=c11 .github/tests/argobots-smoke.c \
                  $(pkg-config --cflags --libs --static argobots) \
                  -Wl,-rpath,"$libdir" -o "$binary"
              else
                cc -std=c11 .github/tests/argobots-smoke.c \
                  -I"$root/include" -L"$libdir" -labt -pthread -ldl -lrt \
                  -Wl,-rpath,"$libdir" -o "$binary"
              fi
              timeout 30s "$binary"
            done
          done
          test ! -d "$root/debug/include"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argobots-${{ matrix.triplet }}-logs
          if-no-files-found: ignore
          retention-days: 7
          path: vcpkg/buildtrees/argobots/**/*.log
