name: RDMA Core Update CI

on:
  push:
    branches: [ci-rdma-core]
    paths:
      - overlay-ports/rdma-core/**
      - overlay-ports/psm2/**
      - .github/workflows/ci-rdma-core.yml
      - .github/tests/ports/rdma-core.c
      - .github/tests/ports/run-smoke.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdma-core-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 3aea538b2bb21a586502c67b00eb474fdd2e3098
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_BINARY_SOURCES: clear

jobs:
  rdma:
    name: rdma-core[kernel-headers,neighbor-resolution] / ${{ matrix.triplet }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        triplet: [x64-linux, x64-linux-dynamic, arm64-linux, arm64-linux-dynamic]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            autoconf autoconf-archive automake libtool libtool-bin m4 \
            bison flex zip unzip tar git

      - name: Install AArch64 cross toolchain
        if: startsWith(matrix.triplet, 'arm64-')
        run: sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Bootstrap pinned vcpkg
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build RDMA core and features
        run: |
          ./vcpkg/vcpkg install "rdma-core[kernel-headers,neighbor-resolution]:${{ matrix.triplet }}" \
            --classic --host-triplet=x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/overlay-ports" \
            --x-install-root="$GITHUB_WORKSPACE/installed"

      - name: Verify installed consumers
        env:
          PORT: rdma-core
          TRIPLET: ${{ matrix.triplet }}
        run: |
          export LINKAGE=static
          if [[ "$TRIPLET" == *-dynamic ]]; then
            export LINKAGE=dynamic
          fi
          bash .github/tests/ports/run-smoke.sh
          root="$GITHUB_WORKSPACE/installed/$TRIPLET"
          test -f "$root/include/rdma/hfi/hfi1_user.h"
          test ! -d "$root/include/linux"

      - name: Verify PSM2 uses installed UAPI headers
        if: matrix.triplet == 'x64-linux-dynamic'
        env:
          PORT: psm2
          TRIPLET: ${{ matrix.triplet }}
          LINKAGE: dynamic
        run: |
          ./vcpkg/vcpkg install "psm2:$TRIPLET" --classic --host-triplet=x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/overlay-ports" \
            --x-install-root="$GITHUB_WORKSPACE/installed"
          bash .github/tests/ports/run-smoke.sh

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdma-core-${{ matrix.triplet }}-logs
          if-no-files-found: ignore
          retention-days: 7
          path: vcpkg/buildtrees/**/*.log
