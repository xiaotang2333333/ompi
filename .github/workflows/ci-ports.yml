name: Isolated Overlay Ports CI

on:
  push:
    branches: [ci-ports]
    paths:
      - overlay-ports/**
      - .github/workflows/ci-ports.yml
      - .github/tests/ports/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-ports-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 3aea538b2bb21a586502c67b00eb474fdd2e3098
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_BINARY_SOURCES: clear

jobs:
  port:
    name: ${{ matrix.port }} / ${{ matrix.triplet }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {port: knem, triplet: x64-linux, linkage: headers}
          - {port: valgrind, triplet: x64-linux, linkage: headers}
          - {port: libnl, triplet: x64-linux, linkage: static}
          - {port: libnl, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: memkind, triplet: x64-linux, linkage: static}
          - {port: memkind, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: munge, triplet: x64-linux, linkage: static}
          - {port: munge, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: portals4, triplet: x64-linux, linkage: static}
          - {port: portals4, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: qthreads, triplet: x64-linux, linkage: static}
          - {port: qthreads, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: xpmem, triplet: x64-linux, linkage: static}
          - {port: xpmem, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: psm2, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: pvfs2, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: ucx, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: ucc, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: openmpi, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: knem, triplet: arm64-linux, linkage: headers}
          - {port: valgrind, triplet: arm64-linux, linkage: headers}
          - {port: libnl, triplet: arm64-linux, linkage: static}
          - {port: libnl, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: memkind, triplet: arm64-linux, linkage: static}
          - {port: memkind, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: munge, triplet: arm64-linux, linkage: static}
          - {port: munge, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: portals4, triplet: arm64-linux, linkage: static}
          - {port: portals4, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: qthreads, triplet: arm64-linux, linkage: static}
          - {port: qthreads, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: xpmem, triplet: arm64-linux, linkage: static}
          - {port: xpmem, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: pvfs2, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: ucx, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: ucc, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: openmpi, triplet: arm64-linux-dynamic, linkage: dynamic}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf autoconf-archive automake libtool libtool-bin m4 \
            gettext bison flex perl python3 zip unzip tar git

      - name: Install AArch64 cross toolchain
        if: startsWith(matrix.triplet, 'arm64-')
        run: sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Bootstrap pinned vcpkg
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build only selected port and its dependencies
        env:
          PORT: ${{ matrix.port }}
          TRIPLET: ${{ matrix.triplet }}
        run: |
          ./vcpkg/vcpkg install "$PORT:$TRIPLET" --classic \
            --host-triplet=x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/overlay-ports" \
            --x-install-root="$GITHUB_WORKSPACE/installed"

      - name: Verify package and consumers
        env:
          PORT: ${{ matrix.port }}
          TRIPLET: ${{ matrix.triplet }}
          LINKAGE: ${{ matrix.linkage }}
        run: bash .github/tests/ports/run-smoke.sh

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.port }}-${{ matrix.triplet }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            vcpkg/buildtrees/**/*.log
            installed/vcpkg/status
