name: Isolated Overlay Ports CI

on:
  push:
    branches: [ci-ports, ci-features]
    paths:
      - overlay-ports/**
      - .github/workflows/ci-ports.yml
      - .github/tests/ports/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-ports-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 3aea538b2bb21a586502c67b00eb474fdd2e3098
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_BINARY_SOURCES: clear

jobs:
  port:
    name: ${{ matrix.port }}${{ matrix.features && format('[{0}]', matrix.features) || '' }} / ${{ matrix.triplet }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {port: hwloc, triplet: x64-linux, linkage: static}
          - {port: hwloc, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: hwloc, triplet: x64-linux-dynamic, linkage: dynamic, features: 'libxml2,cairo,opencl,levelzero,libudev'}
          - {port: hwloc, triplet: x64-linux, linkage: static, features: 'libxml2,cairo,opencl,levelzero,libudev'}
          - {port: knem, triplet: x64-linux, linkage: headers}
          - {port: valgrind, triplet: x64-linux, linkage: headers}
          - {port: libnl, triplet: x64-linux, linkage: static}
          - {port: libnl, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: memkind, triplet: x64-linux, linkage: static}
          - {port: memkind, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: munge, triplet: x64-linux, linkage: static}
          - {port: munge, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: portals4, triplet: x64-linux, linkage: static}
          - {port: portals4, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: qthreads, triplet: x64-linux, linkage: static}
          - {port: qthreads, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: xpmem, triplet: x64-linux, linkage: static}
          - {port: xpmem, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: psm2, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: pvfs2, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: ucx, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: ucc, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: openmpi, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: hwloc, triplet: arm64-linux, linkage: static}
          - {port: hwloc, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: hwloc, triplet: arm64-linux-dynamic, linkage: dynamic, features: 'libxml2,cairo,opencl,libudev'}
          - {port: knem, triplet: arm64-linux, linkage: headers}
          - {port: valgrind, triplet: arm64-linux, linkage: headers}
          - {port: libnl, triplet: arm64-linux, linkage: static}
          - {port: libnl, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: memkind, triplet: arm64-linux, linkage: static}
          - {port: memkind, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: munge, triplet: arm64-linux, linkage: static}
          - {port: munge, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: portals4, triplet: arm64-linux, linkage: static}
          - {port: portals4, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: qthreads, triplet: arm64-linux, linkage: static}
          - {port: qthreads, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: xpmem, triplet: arm64-linux, linkage: static}
          - {port: xpmem, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: pvfs2, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: ucx, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: ucc, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: openmpi, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: rdma-core, triplet: x64-linux-dynamic, linkage: dynamic, features: 'kernel-headers,neighbor-resolution'}
          - {port: rdma-core, triplet: arm64-linux-dynamic, linkage: dynamic, features: 'kernel-headers,neighbor-resolution'}
          - {port: kmod, triplet: x64-linux, linkage: static}
          - {port: kmod, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: kmod, triplet: arm64-linux, linkage: static}
          - {port: kmod, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: kmod, triplet: x64-linux, linkage: static, features: 'openssl,xz,zlib,zstd'}
          - {port: kmod, triplet: x64-linux-dynamic, linkage: dynamic, features: 'openssl,xz,zlib,zstd'}
          - {port: kmod, triplet: arm64-linux, linkage: static, features: 'openssl,xz,zlib,zstd'}
          - {port: kmod, triplet: arm64-linux-dynamic, linkage: dynamic, features: 'openssl,xz,zlib,zstd'}
          - {port: libsystemd, triplet: x64-linux, linkage: static, features: libudev}
          - {port: libsystemd, triplet: x64-linux-dynamic, linkage: dynamic, features: libudev}
          - {port: libsystemd, triplet: arm64-linux, linkage: static, features: libudev}
          - {port: libsystemd, triplet: arm64-linux-dynamic, linkage: dynamic, features: libudev}
          - {port: ndctl, triplet: x64-linux, linkage: static}
          - {port: ndctl, triplet: x64-linux-dynamic, linkage: dynamic}
          - {port: ndctl, triplet: arm64-linux, linkage: static}
          - {port: ndctl, triplet: arm64-linux-dynamic, linkage: dynamic}
          - {port: memkind, triplet: x64-linux, linkage: static, features: 'hwloc,daxctl'}
          - {port: memkind, triplet: x64-linux-dynamic, linkage: dynamic, features: 'hwloc,daxctl'}
          - {port: memkind, triplet: arm64-linux, linkage: static, features: 'hwloc,daxctl'}
          - {port: memkind, triplet: arm64-linux-dynamic, linkage: dynamic, features: 'hwloc,daxctl'}
          - {port: qthreads, triplet: x64-linux, linkage: static, features: hwloc}
          - {port: qthreads, triplet: x64-linux-dynamic, linkage: dynamic, features: hwloc}
          - {port: qthreads, triplet: arm64-linux, linkage: static, features: hwloc}
          - {port: qthreads, triplet: arm64-linux-dynamic, linkage: dynamic, features: hwloc}
          - {port: ucx, triplet: x64-linux-dynamic, linkage: dynamic, features: 'knem,xpmem,valgrind'}
          - {port: ucx, triplet: arm64-linux-dynamic, linkage: dynamic, features: 'knem,xpmem,valgrind'}
          - {port: ucc, triplet: x64-linux-dynamic, linkage: dynamic, features: 'ibverbs,rdmacm'}
          - {port: ucc, triplet: arm64-linux-dynamic, linkage: dynamic, features: 'ibverbs,rdmacm'}
          - {port: portals4, triplet: x64-linux, linkage: static, features: knem, compile_only: true}
          - {port: portals4, triplet: x64-linux-dynamic, linkage: dynamic, features: knem, compile_only: true}
          - {port: portals4, triplet: arm64-linux, linkage: static, features: knem, compile_only: true}
          - {port: portals4, triplet: arm64-linux-dynamic, linkage: dynamic, features: knem, compile_only: true}
          - {port: pvfs2, triplet: x64-linux-dynamic, linkage: dynamic, features: ssl}
          - {port: pvfs2, triplet: arm64-linux-dynamic, linkage: dynamic, features: ssl}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf autoconf-archive automake libtool libtool-bin m4 \
            gettext bison flex perl python3 zip unzip tar git

      - name: Install AArch64 cross toolchain
        if: startsWith(matrix.triplet, 'arm64-')
        run: sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Bootstrap pinned vcpkg
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build only selected port and its dependencies
        env:
          PORT: ${{ matrix.port }}
          TRIPLET: ${{ matrix.triplet }}
          FEATURES: ${{ matrix.features }}
        run: |
          spec="$PORT"
          if [[ -n "$FEATURES" ]]; then
            spec="$PORT[$FEATURES]"
          fi
          ./vcpkg/vcpkg install "$spec:$TRIPLET" --classic \
            --host-triplet=x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/overlay-ports" \
            --x-install-root="$GITHUB_WORKSPACE/installed"

      - name: Verify package and consumers
        env:
          PORT: ${{ matrix.port }}
          TRIPLET: ${{ matrix.triplet }}
          LINKAGE: ${{ matrix.linkage }}
          FEATURES: ${{ matrix.features }}
          COMPILE_ONLY: ${{ matrix.compile_only || false }}
        run: bash .github/tests/ports/run-smoke.sh

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.port }}-${{ matrix.features || 'core' }}-${{ matrix.triplet }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            vcpkg/buildtrees/**/*.log
            installed/vcpkg/status
